<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="340" rx="190" ry="20" fill="#000000" fill-opacity="0.12"/>
  
  <g transform="translate(65, 55)">
    <!-- Screen Display (Tilted open) -->
    <rect x="45" y="10" width="280" height="195" rx="8" fill="#1C1F22" stroke="#495057" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="52" y="17" width="266" height="175" rx="4" fill="#0A0C0E"/>
    
    <!-- Screen Glass & Barterin Mint Graphic Wallpaper -->
    <rect x="56" y="21" width="258" height="167" rx="2" fill="#0E2E28"/>
    <!-- Abstract Mint Shapes on Screen -->
    <circle cx="160" cy="110" r="50" fill="#00BFA5" fill-opacity="0.5"/>
    <circle cx="210" cy="80" r="35" fill="#80CBC4" fill-opacity="0.6"/>
    <path d="M70 160 L140 90 L200 140 L280 80 L310 120 L310 188 L56 188 Z" fill="#004D40" fill-opacity="0.7"/>
    <!-- WebCam at Top -->
    <circle cx="185" cy="14" r="2" fill="#343A40"/>
    <circle cx="185" cy="14" r="0.8" fill="#00BFA5"/>

    <!-- Screen Hinge -->
    <rect x="140" y="204" width="90" height="6" rx="2" fill="#2E3338"/>

    <!-- Bottom Chassis / Keyboard Deck (Perspective trapezoid) -->
    <polygon points="10,245 360,245 330,207 40,207" fill="#CFD8DC" stroke="#B0BEC5" stroke-width="1.5"/>
    
    <!-- Keyboard Well -->
    <polygon points="50,230 320,230 305,212 65,212" fill="#263238"/>
    <!-- Trackpad -->
    <rect x="150" y="234" width="70" height="8" rx="2" fill="#B0BEC5"/>

    <!-- Front Lip with Thumb Notch -->
    <path d="M10 245 L360 245 L360 252 C360 255, 355 258, 350 258 L20 258 C15 258, 10 255, 10 252 Z" fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1"/>
    <rect x="170" y="245" width="30" height="3" rx="1.5" fill="#90A4AE"/>
  </g>
</svg>
