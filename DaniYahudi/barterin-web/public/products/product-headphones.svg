<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="340" rx="160" ry="20" fill="#000000" fill-opacity="0.1"/>
  
  <g transform="translate(100, 45)">
    <!-- Padded Headband Arch -->
    <path d="M50 170 C50 60, 250 60, 250 170" stroke="#212529" stroke-width="26" stroke-linecap="round"/>
    <!-- Headband Soft Cushion Underside -->
    <path d="M70 150 C70 85, 230 85, 230 150" stroke="#343A40" stroke-width="12" stroke-linecap="round"/>
    <!-- Mint Accent Trim on Headband -->
    <path d="M120 74 C135 70, 165 70, 180 74" stroke="#00BFA5" stroke-width="3" stroke-linecap="round"/>

    <!-- Left Fork / Gimbal Arm -->
    <path d="M45 160 L45 200" stroke="#6C757D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="45" cy="205" r="8" fill="#495057"/>

    <!-- Right Fork / Gimbal Arm -->
    <path d="M255 160 L255 200" stroke="#6C757D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="255" cy="205" r="8" fill="#495057"/>

    <!-- Left Ear Cup (Matte Charcoal with Mint Ring) -->
    <g transform="translate(15, 180)">
      <ellipse cx="30" cy="55" rx="32" ry="52" fill="#1C1F22" stroke="#2B3035" stroke-width="2"/>
      <ellipse cx="30" cy="55" rx="26" ry="44" fill="#282C30"/>
      <circle cx="30" cy="55" r="18" fill="#00BFA5" fill-opacity="0.15" stroke="#00BFA5" stroke-width="2"/>
      <!-- Soft Memory Foam Pad (Backside visible) -->
      <path d="M48 15 C58 30, 58 75, 48 95" stroke="#121416" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Right Ear Cup (Matte Charcoal with Mint Ring) -->
    <g transform="translate(225, 180)">
      <ellipse cx="30" cy="55" rx="32" ry="52" fill="#1C1F22" stroke="#2B3035" stroke-width="2"/>
      <ellipse cx="30" cy="55" rx="26" ry="44" fill="#282C30"/>
      <circle cx="30" cy="55" r="18" fill="#00BFA5" fill-opacity="0.15" stroke="#00BFA5" stroke-width="2"/>
      <!-- Soft Memory Foam Pad (Backside visible) -->
      <path d="M12 15 C2 30, 2 75, 12 95" stroke="#121416" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
