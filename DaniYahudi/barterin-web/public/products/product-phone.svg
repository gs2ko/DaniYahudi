<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="345" rx="140" ry="18" fill="#000000" fill-opacity="0.1"/>
  
  <!-- Smartphone Chassis at 3/4 perspective / straight front-back view -->
  <g transform="translate(165, 50)">
    <!-- Phone Body (Mint/Alpine Green) -->
    <rect x="0" y="0" width="170" height="295" rx="34" fill="#0E2E28" stroke="#1D4E44" stroke-width="4"/>
    <rect x="3" y="3" width="164" height="289" rx="31" fill="#143C34"/>
    
    <!-- Subtle specular highlight on edge -->
    <path d="M30 4 L140 4" stroke="#48A894" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Camera Plateau / Island -->
    <rect x="14" y="16" width="70" height="70" rx="18" fill="#0C2520" stroke="#1B473E" stroke-width="1.5"/>
    <circle cx="49" cy="51" r="28" fill="#0E2C26" fill-opacity="0.5"/>

    <!-- Lens 1 (Wide) Top-Left -->
    <circle cx="34" cy="35" r="15" fill="#081815" stroke="#255E53" stroke-width="2"/>
    <circle cx="34" cy="35" r="10" fill="#050E0C"/>
    <circle cx="34" cy="35" r="7" fill="#00BFA5" fill-opacity="0.3"/>
    <circle cx="31" cy="32" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Lens 2 (Ultra-Wide) Bottom-Right -->
    <circle cx="64" cy="65" r="15" fill="#081815" stroke="#255E53" stroke-width="2"/>
    <circle cx="64" cy="65" r="10" fill="#050E0C"/>
    <circle cx="64" cy="65" r="7" fill="#00BFA5" fill-opacity="0.3"/>
    <circle cx="61" cy="62" r="2.5" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- True Tone Flash & Mic -->
    <circle cx="64" cy="32" r="6" fill="#FFF9C4" stroke="#FFF59D" stroke-width="1"/>
    <circle cx="64" cy="32" r="2.5" fill="#FFF176"/>
    <circle cx="35" cy="65" r="2.5" fill="#050D0B"/>

    <!-- Centered Subtle Logo -->
    <path d="M85 140 C85 132, 90 126, 96 128 C94 135, 91 144, 96 150 C93 152, 90 150, 85 140 Z" fill="#255E53" opacity="0.4"/>
    
    <!-- Side buttons hint -->
    <rect x="-3" y="60" width="3" height="22" rx="1.5" fill="#0C2520"/>
    <rect x="-3" y="90" width="3" height="22" rx="1.5" fill="#0C2520"/>
    <rect x="170" y="75" width="3" height="36" rx="1.5" fill="#0C2520"/>
  </g>
</svg>
