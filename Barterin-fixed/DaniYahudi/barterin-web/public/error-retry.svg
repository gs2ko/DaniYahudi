<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Subtle circular aura -->
  <circle cx="200" cy="200" r="140" fill="#FFF9F5"/>
  <circle cx="80" cy="130" r="12" fill="#FFE0B2"/>
  <circle cx="320" cy="130" r="14" fill="#E0F2F1"/>

  <!-- Tangled loop / Refresh icon symbol -->
  <g transform="translate(160, 60)">
    <circle cx="40" cy="40" r="32" fill="#FFEBEE"/>
    <path d="M54 30 C51 22, 42 16, 32 18 C20 20, 14 32, 17 44 C20 54, 30 62, 42 61 C50 60, 57 55, 60 48" stroke="#E53935" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M50 16 L56 26 L44 28" fill="#E53935"/>
    <circle cx="40" cy="38" r="3" fill="#E53935"/>
  </g>

  <!-- Puzzled character shrugging gently -->
  <!-- Legs -->
  <path d="M185 270 L175 340 L160 345" stroke="#37474F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M210 270 L220 340 L235 345" stroke="#37474F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso & coral/mint combo -->
  <path d="M175 195 C175 175, 215 175, 215 195 L210 270 C210 280, 180 280, 180 270 Z" fill="#FF8A65"/>
  <path d="M195 195 L195 240" stroke="#D84315" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Head tilted quizzically -->
  <g transform="rotate(-8 200 150)">
    <circle cx="200" cy="150" r="16" fill="#FFCCBC"/>
    <path d="M190 145 C190 130, 218 130, 218 145 C218 158, 206 156, 190 145 Z" fill="#263238"/>
    <circle cx="206" cy="148" r="2" fill="#212121"/>
    <path d="M200 158 Q 205 155 210 158" stroke="#212121" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Shrugging arms -->
  <path d="M175 205 Q 145 190 135 170" stroke="#FFCCBC" stroke-width="9" stroke-linecap="round"/>
  <circle cx="133" cy="168" r="5" fill="#FFCCBC"/>
  
  <path d="M215 205 Q 245 190 255 170" stroke="#FFCCBC" stroke-width="9" stroke-linecap="round"/>
  <circle cx="257" cy="168" r="5" fill="#FFCCBC"/>

  <!-- Question mark near head -->
  <text x="235" y="140" font-family="'Roboto', sans-serif" font-size="22" font-weight="700" fill="#FF8A65">?</text>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="355" rx="90" ry="7" fill="#EFEBE9"/>
</svg>
