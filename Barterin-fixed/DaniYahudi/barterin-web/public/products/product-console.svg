<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="315" rx="190" ry="20" fill="#000000" fill-opacity="0.12"/>
  
  <g transform="translate(60, 110)">
    <!-- Console Center Screen Unit -->
    <rect x="75" y="0" width="230" height="150" rx="6" fill="#1C1F22"/>
    <rect x="85" y="10" width="210" height="130" rx="3" fill="#0A0C0E"/>
    <!-- Vibrant Game Display (Pixel Art / Adventure Scene) -->
    <rect x="88" y="13" width="204" height="124" rx="2" fill="#0D2824"/>
    <circle cx="190" cy="65" r="28" fill="#00BFA5" fill-opacity="0.4"/>
    <polygon points="120,137 170,80 210,120 250,70 292,137" fill="#004D40"/>
    <polygon points="150,137 190,95 230,137" fill="#00BFA5" fill-opacity="0.8"/>
    <!-- Speaker Grilles -->
    <circle cx="100" cy="130" r="1.5" fill="#37474F"/>
    <circle cx="105" cy="130" r="1.5" fill="#37474F"/>
    <circle cx="275" cy="130" r="1.5" fill="#37474F"/>
    <circle cx="280" cy="130" r="1.5" fill="#37474F"/>

    <!-- Left Joy-Con (Mint Green Signature) -->
    <path d="M75 0 L25 0 C10 0, 0 15, 0 35 L0 115 C0 135, 10 150, 25 150 L75 150 Z" fill="#00BFA5"/>
    <path d="M75 4 L25 4 C12 4, 4 17, 4 35 L4 115 C4 133, 12 146, 25 146 L75 146" stroke="#00897B" stroke-width="2"/>
    
    <!-- Left Analog Stick -->
    <circle cx="36" cy="45" r="15" fill="#212529" stroke="#37474F" stroke-width="2"/>
    <circle cx="36" cy="45" r="10" fill="#181A1C"/>
    <path d="M36 39v12M30 45h12" stroke="#455A64" stroke-width="1.5"/>

    <!-- Left D-Pad Buttons -->
    <circle cx="36" cy="90" r="4.5" fill="#263238"/>
    <circle cx="24" cy="102" r="4.5" fill="#263238"/>
    <circle cx="48" cy="102" r="4.5" fill="#263238"/>
    <circle cx="36" cy="114" r="4.5" fill="#263238"/>
    <!-- Minus Button -->
    <rect x="52" y="16" width="10" height="3" rx="1.5" fill="#263238"/>

    <!-- Right Joy-Con (Warm Coral Accent) -->
    <path d="M305 0 L355 0 C370 0, 380 15, 380 35 L380 115 C380 135, 370 150, 355 150 L305 150 Z" fill="#FF7043"/>
    <path d="M305 4 L355 4 C368 4, 376 17, 376 35 L376 115 C376 133, 368 146, 355 146 L305 146" stroke="#E64A19" stroke-width="2"/>

    <!-- Right Action Buttons (ABXY) -->
    <circle cx="344" cy="35" r="4.5" fill="#263238"/>
    <circle cx="332" cy="47" r="4.5" fill="#263238"/>
    <circle cx="356" cy="47" r="4.5" fill="#263238"/>
    <circle cx="344" cy="59" r="4.5" fill="#263238"/>

    <!-- Right Analog Stick -->
    <circle cx="344" cy="98" r="15" fill="#212529" stroke="#37474F" stroke-width="2"/>
    <circle cx="344" cy="98" r="10" fill="#181A1C"/>
    <path d="M344 92v12M338 98h12" stroke="#455A64" stroke-width="1.5"/>

    <!-- Plus Button & Home -->
    <path d="M322 17v8M318 21h8" stroke="#263238" stroke-width="2" stroke-linecap="round"/>
    <circle cx="325" cy="125" r="6" fill="#37474F" stroke="#263238" stroke-width="1"/>
  </g>
</svg>
