<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="315" rx="190" ry="22" fill="#000000" fill-opacity="0.12"/>
  
  <!-- Mechanical Keyboard Chassis (75% compact layout) -->
  <g id="keyboard" transform="translate(60, 115)">
    <!-- Base Case (Anodized Aluminum Charcoal) -->
    <rect x="0" y="0" width="380" height="175" rx="12" fill="#212529" stroke="#343A40" stroke-width="2"/>
    <rect x="6" y="6" width="368" height="163" rx="8" fill="#1A1D20"/>

    <!-- Rotary Encoder Knob (Top-Right) -->
    <circle cx="352" cy="24" r="12" fill="#00BFA5" stroke="#00897B" stroke-width="2"/>
    <circle cx="352" cy="24" r="8" fill="#004D40"/>
    <circle cx="352" cy="18" r="1.5" fill="#FFFFFF"/>

    <!-- Keycap Row 1 (F-Row / Numbers) -->
    <g fill="#37474F" stroke="#263238" stroke-width="1">
      <!-- Esc (Mint Accent) -->
      <rect x="14" y="14" width="20" height="18" rx="3" fill="#00BFA5" stroke="#00897B"/>
      <!-- Keys -->
      <rect x="38" y="14" width="18" height="18" rx="3"/>
      <rect x="58" y="14" width="18" height="18" rx="3"/>
      <rect x="78" y="14" width="18" height="18" rx="3"/>
      <rect x="98" y="14" width="18" height="18" rx="3"/>
      <rect x="122" y="14" width="18" height="18" rx="3"/>
      <rect x="142" y="14" width="18" height="18" rx="3"/>
      <rect x="162" y="14" width="18" height="18" rx="3"/>
      <rect x="182" y="14" width="18" height="18" rx="3"/>
      <rect x="206" y="14" width="18" height="18" rx="3"/>
      <rect x="226" y="14" width="18" height="18" rx="3"/>
      <rect x="246" y="14" width="18" height="18" rx="3"/>
      <rect x="266" y="14" width="18" height="18" rx="3"/>
      <rect x="286" y="14" width="24" height="18" rx="3" fill="#455A64"/>
      <!-- Del -->
      <rect x="314" y="14" width="18" height="18" rx="3" fill="#455A64"/>
    </g>

    <!-- Keycap Row 2 (QWERTY) -->
    <g fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1">
      <rect x="14" y="36" width="24" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
      <rect x="42" y="36" width="18" height="18" rx="3"/>
      <rect x="62" y="36" width="18" height="18" rx="3"/>
      <rect x="82" y="36" width="18" height="18" rx="3"/>
      <rect x="102" y="36" width="18" height="18" rx="3"/>
      <rect x="122" y="36" width="18" height="18" rx="3"/>
      <rect x="142" y="36" width="18" height="18" rx="3"/>
      <rect x="162" y="36" width="18" height="18" rx="3"/>
      <rect x="182" y="36" width="18" height="18" rx="3"/>
      <rect x="202" y="36" width="18" height="18" rx="3"/>
      <rect x="222" y="36" width="18" height="18" rx="3"/>
      <rect x="242" y="36" width="18" height="18" rx="3"/>
      <rect x="262" y="36" width="18" height="18" rx="3"/>
      <rect x="282" y="36" width="28" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
      <rect x="314" y="36" width="18" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
    </g>

    <!-- Keycap Row 3 (ASDF) -->
    <g fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1">
      <rect x="14" y="58" width="28" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
      <rect x="46" y="58" width="18" height="18" rx="3"/>
      <rect x="66" y="58" width="18" height="18" rx="3"/>
      <rect x="86" y="58" width="18" height="18" rx="3"/>
      <rect x="106" y="58" width="18" height="18" rx="3"/>
      <rect x="126" y="58" width="18" height="18" rx="3"/>
      <rect x="146" y="58" width="18" height="18" rx="3"/>
      <rect x="166" y="58" width="18" height="18" rx="3"/>
      <rect x="186" y="58" width="18" height="18" rx="3"/>
      <rect x="206" y="58" width="18" height="18" rx="3"/>
      <rect x="226" y="58" width="18" height="18" rx="3"/>
      <rect x="246" y="58" width="18" height="18" rx="3"/>
      <!-- Enter Key (Mint Accent) -->
      <rect x="268" y="58" width="42" height="18" rx="3" fill="#00BFA5" stroke="#00897B"/>
      <rect x="314" y="58" width="18" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
    </g>

    <!-- Keycap Row 4 (ZXCV) -->
    <g fill="#ECEFF1" stroke="#CFD8DC" stroke-width="1">
      <rect x="14" y="80" width="34" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
      <rect x="52" y="80" width="18" height="18" rx="3"/>
      <rect x="72" y="80" width="18" height="18" rx="3"/>
      <rect x="92" y="80" width="18" height="18" rx="3"/>
      <rect x="112" y="80" width="18" height="18" rx="3"/>
      <rect x="132" y="80" width="18" height="18" rx="3"/>
      <rect x="152" y="80" width="18" height="18" rx="3"/>
      <rect x="172" y="80" width="18" height="18" rx="3"/>
      <rect x="192" y="80" width="18" height="18" rx="3"/>
      <rect x="212" y="80" width="18" height="18" rx="3"/>
      <rect x="232" y="80" width="18" height="18" rx="3"/>
      <rect x="254" y="80" width="34" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
      <rect x="292" y="80" width="18" height="18" rx="3" fill="#00BFA5" stroke="#00897B"/>
      <rect x="314" y="80" width="18" height="18" rx="3" fill="#455A64" stroke="#37474F"/>
    </g>

    <!-- Keycap Row 5 (Bottom Row / Spacebar) -->
    <g fill="#455A64" stroke="#37474F" stroke-width="1">
      <rect x="14" y="102" width="22" height="20" rx="3"/>
      <rect x="40" y="102" width="22" height="20" rx="3"/>
      <rect x="66" y="102" width="22" height="20" rx="3"/>
      <!-- Mint Accent Spacebar -->
      <rect x="92" y="102" width="124" height="20" rx="4" fill="#00BFA5" stroke="#00897B"/>
      <rect x="220" y="102" width="20" height="20" rx="3"/>
      <rect x="244" y="102" width="20" height="20" rx="3"/>
      <!-- Arrows -->
      <rect x="268" y="102" width="18" height="20" rx="3" fill="#00BFA5" stroke="#00897B"/>
      <rect x="290" y="102" width="18" height="20" rx="3" fill="#00BFA5" stroke="#00897B"/>
      <rect x="312" y="102" width="18" height="20" rx="3" fill="#00BFA5" stroke="#00897B"/>
    </g>
    
    <!-- RGB underglow strip -->
    <path d="M12 165 L368 165" stroke="#00BFA5" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
