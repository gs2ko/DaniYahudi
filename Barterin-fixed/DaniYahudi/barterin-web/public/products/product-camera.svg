<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" fill="none">
  <!-- Studio Background -->
  <rect width="500" height="400" fill="#F8FAFA"/>
  <ellipse cx="250" cy="340" rx="180" ry="24" fill="#000000" fill-opacity="0.08"/>
  <ellipse cx="250" cy="336" rx="140" ry="16" fill="#000000" fill-opacity="0.12"/>
  
  <!-- Mirrorless Camera Body -->
  <g id="camera-body">
    <!-- Main Chassis -->
    <rect x="110" y="140" width="280" height="180" rx="14" fill="#212529"/>
    <rect x="112" y="142" width="276" height="176" rx="12" stroke="#343A40" stroke-width="2"/>
    
    <!-- Grip on Right Side -->
    <path d="M110 160 C110 145, 140 145, 145 160 L145 305 C145 320, 110 320, 110 305 Z" fill="#1C1F22"/>
    <!-- Grip Texture Dots -->
    <g fill="#2C3034" opacity="0.6">
      <circle cx="120" cy="180" r="1.5"/><circle cx="128" cy="180" r="1.5"/><circle cx="136" cy="180" r="1.5"/>
      <circle cx="120" cy="195" r="1.5"/><circle cx="128" cy="195" r="1.5"/><circle cx="136" cy="195" r="1.5"/>
      <circle cx="120" cy="210" r="1.5"/><circle cx="128" cy="210" r="1.5"/><circle cx="136" cy="210" r="1.5"/>
      <circle cx="120" cy="225" r="1.5"/><circle cx="128" cy="225" r="1.5"/><circle cx="136" cy="225" r="1.5"/>
      <circle cx="120" cy="240" r="1.5"/><circle cx="128" cy="240" r="1.5"/><circle cx="136" cy="240" r="1.5"/>
      <circle cx="120" cy="255" r="1.5"/><circle cx="128" cy="255" r="1.5"/><circle cx="136" cy="255" r="1.5"/>
      <circle cx="120" cy="270" r="1.5"/><circle cx="128" cy="270" r="1.5"/><circle cx="136" cy="270" r="1.5"/>
    </g>

    <!-- Top Plate Dials & Controls -->
    <!-- Mode Dial -->
    <rect x="310" y="126" width="46" height="15" rx="3" fill="#3E444A"/>
    <line x1="316" y1="126" x2="316" y2="141" stroke="#212529" stroke-width="2"/>
    <line x1="324" y1="126" x2="324" y2="141" stroke="#212529" stroke-width="2"/>
    <line x1="332" y1="126" x2="332" y2="141" stroke="#212529" stroke-width="2"/>
    <line x1="340" y1="126" x2="340" y2="141" stroke="#212529" stroke-width="2"/>
    
    <!-- Shutter Button with Power Switch -->
    <ellipse cx="135" cy="138" rx="14" ry="4" fill="#6C757D"/>
    <circle cx="135" cy="135" r="9" fill="#ADB5BD"/>
    <circle cx="135" cy="135" r="6" fill="#495057"/>

    <!-- Hotshoe -->
    <rect x="235" y="132" width="30" height="9" rx="2" fill="#1C1F22"/>
    <rect x="240" y="130" width="20" height="3" fill="#6C757D"/>

    <!-- Lens Mount & Barrel -->
    <circle cx="270" cy="230" r="82" fill="#181A1C"/>
    <circle cx="270" cy="230" r="76" fill="#2E3338" stroke="#495057" stroke-width="3"/>
    
    <!-- Ribbed Focus Ring -->
    <circle cx="270" cy="230" r="68" fill="#1A1C1E"/>
    <!-- Glass Elements & Anti-reflective Coating Reflections -->
    <circle cx="270" cy="230" r="54" fill="#0D1318"/>
    <!-- Glass coating multi-color bloom: emerald green & violet sheen -->
    <circle cx="270" cy="230" r="48" fill="#003B46" fill-opacity="0.3"/>
    <path d="M235 200 A 48 48 0 0 1 305 200 A 46 46 0 0 0 235 200 Z" fill="#00BFA5" fill-opacity="0.35"/>
    <circle cx="255" cy="215" r="16" fill="#9C27B0" fill-opacity="0.2"/>
    <circle cx="282" cy="245" r="8" fill="#FFFFFF" fill-opacity="0.25"/>
    <circle cx="250" cy="210" r="4" fill="#FFFFFF" fill-opacity="0.6"/>

    <!-- Front Lens Ring Text -->
    <text x="270" y="172" font-family="'Roboto', sans-serif" font-size="7" font-weight="600" fill="#9E9E9E" text-anchor="middle" letter-spacing="1">E-MOUNT 16-50mm F3.5-5.6 OSS</text>

    <!-- AF Assist Lamp -->
    <circle cx="165" cy="170" r="5" fill="#C62828"/>
    <circle cx="164" cy="169" r="1.5" fill="#FFFFFF" fill-opacity="0.7"/>

    <!-- Brand Badge -->
    <rect x="235" y="152" width="36" height="12" rx="2" fill="#111315"/>
    <text x="253" y="161" font-family="'Roboto', sans-serif" font-size="8" font-weight="700" fill="#ECEFF1" text-anchor="middle" letter-spacing="1">SONY</text>
    
    <!-- Sensor format tag -->
    <text x="355" y="162" font-family="'Roboto', sans-serif" font-size="7" font-weight="700" fill="#E53935">α6000</text>
  </g>
</svg>
