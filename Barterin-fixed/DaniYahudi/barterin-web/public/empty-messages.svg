<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Background decorative geometric shapes -->
  <circle cx="200" cy="200" r="140" fill="#F4FBF9"/>
  <circle cx="310" cy="120" r="18" fill="#E0F2F1"/>
  <rect x="70" y="270" width="24" height="24" rx="6" fill="#E0F2F1" transform="rotate(15 70 270)"/>
  <circle cx="90" cy="110" r="8" fill="#FFE082"/>
  
  <!-- Sitting bench / platform -->
  <rect x="110" y="290" width="180" height="14" rx="7" fill="#B2DFDB"/>
  <rect x="135" y="304" width="8" height="40" rx="4" fill="#80CBC4"/>
  <rect x="257" y="304" width="8" height="40" rx="4" fill="#80CBC4"/>

  <!-- Character relaxing with phone waiting for messages -->
  <!-- Legs -->
  <path d="M165 240 L160 300 L140 335 L125 335" stroke="#263238" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M185 240 L195 295 L220 335 L240 335" stroke="#00BFA5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Torso & mint jacket -->
  <path d="M180 180 C180 160, 210 160, 210 180 L205 245 C205 255, 175 255, 175 245 Z" fill="#00BFA5"/>
  <path d="M190 170 L190 220" stroke="#00897B" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Head & Hair (Corporate Memphis style: small head, expressive posture) -->
  <circle cx="192" cy="135" r="18" fill="#FFCCBC"/>
  <path d="M180 130 C180 115, 210 115, 212 130 C212 145, 195 142, 180 130 Z" fill="#37474F"/>
  <circle cx="196" cy="136" r="2" fill="#212121"/>
  <path d="M192 142 Q196 146 200 142" stroke="#212121" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  
  <!-- Arm holding coffee / leaning -->
  <path d="M175 190 Q150 205 160 230" stroke="#FFCCBC" stroke-width="10" stroke-linecap="round"/>
  <!-- Arm resting on knee -->
  <path d="M210 190 Q235 210 215 245" stroke="#FFCCBC" stroke-width="10" stroke-linecap="round"/>

  <!-- Floating empty speech bubbles -->
  <g transform="translate(230, 90)">
    <path d="M10 20 C10 9, 20 0, 45 0 C70 0, 80 9, 80 20 C80 31, 70 40, 45 40 L30 40 L18 50 L22 40 C14 38, 10 31, 10 20 Z" fill="#FFFFFF" stroke="#00BFA5" stroke-width="2.5"/>
    <circle cx="35" cy="20" r="3" fill="#B2DFDB"/>
    <circle cx="45" cy="20" r="3" fill="#80CBC4"/>
    <circle cx="55" cy="20" r="3" fill="#00BFA5"/>
  </g>
  <g transform="translate(100, 70) scale(0.65)">
    <path d="M10 20 C10 9, 20 0, 45 0 C70 0, 80 9, 80 20 C80 31, 70 40, 45 40 L30 40 L18 50 L22 40 C14 38, 10 31, 10 20 Z" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="2"/>
    <path d="M30 20 L60 20" stroke="#CFD8DC" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Ground shadow -->
  <ellipse cx="200" cy="355" rx="100" ry="8" fill="#E0F2F1"/>
</svg>
