<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" width="240" height="64" fill="none">
  <!-- Barterin Icon: Dual curved exchange arrows forming a dynamic 'B' and trade loop -->
  <g transform="translate(4, 8)">
    <rect width="48" height="48" rx="14" fill="#00BFA5"/>
    <!-- Exchange arrows in crisp white & soft mint -->
    <path d="M14 20h15a5 5 0 0 1 5 5v1m0 0l-4-4m4 4l4-4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 28H19a5 5 0 0 0-5 5v1m0 0l4-4m-4 4l-4 4" stroke="#E0F2F1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Accent dot representing balance/money adjustment -->
    <circle cx="24" cy="24" r="2.5" fill="#FFE082"/>
  </g>
  
  <!-- Wordmark "Barterin" + Slogan "baterin aja" -->
  <text x="64" y="36" font-family="'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5" fill="#212121">
    Barter<tspan fill="#00BFA5">in</tspan>
  </text>
  <text x="64" y="49" font-family="'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" letter-spacing="0.3" fill="#757575">
    baterin aja
  </text>
</svg>
