<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" fill="none">
  <!-- Background circular aura -->
  <circle cx="200" cy="200" r="140" fill="#F4FBF9"/>
  <circle cx="90" cy="140" r="14" fill="#E0F2F1"/>
  <circle cx="310" cy="270" r="22" fill="#E0F2F1"/>
  <circle cx="320" cy="110" r="8" fill="#FFE082"/>

  <!-- Two trading puzzle pieces floating apart with dashed search link -->
  <g transform="translate(80, 110)">
    <rect width="60" height="60" rx="10" fill="#FFFFFF" stroke="#00BFA5" stroke-width="3"/>
    <path d="M22 30h16M30 22v16" stroke="#00BFA5" stroke-width="3" stroke-linecap="round"/>
    <!-- Item icon inside puzzle: Camera outline -->
    <rect x="18" y="22" width="24" height="18" rx="3" stroke="#00897B" stroke-width="2" fill="#E0F2F1"/>
    <circle cx="30" cy="31" r="4" stroke="#00897B" stroke-width="2"/>
  </g>

  <g transform="translate(260, 110)">
    <rect width="60" height="60" rx="10" fill="#FFFFFF" stroke="#FF8A65" stroke-width="3"/>
    <!-- Item icon inside puzzle: Smartphone outline -->
    <rect x="22" y="16" width="16" height="28" rx="3" stroke="#D84315" stroke-width="2" fill="#FBE9E7"/>
    <circle cx="30" cy="40" r="1.5" fill="#D84315"/>
  </g>

  <!-- Dashed curve connecting them with question mark -->
  <path d="M145 140 Q 200 100 255 140" stroke="#80CBC4" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
  <circle cx="200" cy="112" r="14" fill="#FFF9C4"/>
  <text x="196" y="117" font-family="'Roboto', sans-serif" font-size="14" font-weight="700" fill="#F57F17">?</text>

  <!-- Character looking through magnifying glass -->
  <!-- Legs -->
  <path d="M185 270 L175 345 L155 350" stroke="#37474F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M205 270 L215 345 L235 350" stroke="#37474F" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Torso & clothes -->
  <path d="M175 200 C175 180, 220 180, 220 200 L215 275 C215 285, 180 285, 180 275 Z" fill="#00BFA5"/>

  <!-- Head -->
  <circle cx="198" cy="155" r="16" fill="#FFCCBC"/>
  <path d="M186 150 C186 135, 212 135, 214 150 C214 162, 202 160, 186 150 Z" fill="#263238"/>
  <circle cx="203" cy="155" r="2" fill="#212121"/>
  <path d="M198 162 Q 203 166 207 162" stroke="#212121" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Arms holding oversized stylized magnifying glass -->
  <path d="M180 210 Q 150 210 160 170" stroke="#FFCCBC" stroke-width="9" stroke-linecap="round"/>
  <path d="M210 210 Q 220 220 180 180" stroke="#FFCCBC" stroke-width="9" stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="150" cy="165" r="22" stroke="#FFB74D" stroke-width="5" fill="#FFF8E1" fill-opacity="0.6"/>
  <path d="M165 180 L185 200" stroke="#D84315" stroke-width="6" stroke-linecap="round"/>
  <circle cx="144" cy="158" r="4" fill="#FFFFFF"/>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="360" rx="90" ry="7" fill="#E0F2F1"/>
</svg>
